<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amitosh Kumar | Economics | Finance | Policy</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Deep Studio Black */
            --bg-base: #050505; 
            --text-main: #F4F4F5;
            --text-muted: rgba(235, 235, 245, 0.5); 
            
            /* Liquid Glass Variables */
            --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            --glass-hover: linear-gradient(145deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.02) 100%);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            
            /* Restrained Theme Colors */
            --theme-accent: #c9a975; 
            --theme-accent-dim: #8b7956;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 40px 20px 20px 20px;
        }

        /* NEW 2-COLUMN LAYOUT */
        .page-layout {
            display: grid;
            grid-template-columns: minmax(auto, 900px) 360px; /* Main content left, sidebar right */
            gap: 32px;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            align-items: start;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 32px;
            width: 100%;
        }

        /* RIGHT SIDEBAR (Contains both panels) */
        .right-sidebar {
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: sticky;
            top: 40px;
        }

        /* LIQUID GLASS UTILITY CLASS */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid var(--glass-highlight);
            box-shadow: var(--glass-shadow);
            border-radius: 32px;
        }

        /* SIDE PANELS CSS */
        .side-panel {
            padding: 24px 16px 24px 24px; /* Less right padding for scrollbar */
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-radius: 28px;
        }

        .panel-header {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            color: var(--theme-accent);
            display: flex;
            align-items: center;
            gap: 10px;
            font-style: italic;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 12px;
            margin-right: 8px;
        }

        /* SCROLLABLE WRAPPER */
        .posts-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 280px; /* Keeps panel small */
            overflow-y: auto;
            padding-right: 8px; /* Space for scrollbar */
        }

        /* Custom Scrollbar for feeds */
        .posts-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .posts-wrapper::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .posts-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        .posts-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--theme-accent-dim);
        }

        /* COMPACT POST CARD WITH HOVER GLOW */
        .post-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: row; 
            align-items: center;
            padding: 10px;
            gap: 12px;
        }

        .post-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(201, 169, 117, 0.5);
            transform: translateX(4px);
            box-shadow: 0 0 15px rgba(201, 169, 117, 0.25); /* Subtle glow effect */
        }

        .post-img {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .post-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .post-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
        }

        .post-excerpt {
            font-size: 0.7rem;
            color: var(--text-muted);
            line-height: 1.4;
            font-weight: 400;
            /* Truncates text to exactly 2 lines */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-meta {
            font-size: 0.6rem;
            color: var(--theme-accent-dim);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* HEADER */
        header { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .header-title h1 { 
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 4vw, 3.8rem); 
            font-weight: 500; 
            letter-spacing: -0.5px;
            line-height: 1.1;
            color: var(--text-main);
        }
        
        .header-title p { 
            font-size: clamp(0.75rem, 1vw, 0.85rem); 
            letter-spacing: 3px; 
            color: var(--theme-accent-dim); 
            font-weight: 600; 
            text-transform: uppercase;
            margin-top: 10px;
            margin-left: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* BUTTONS */
        .glass-btn {
            text-decoration: none;
            color: var(--text-main);
            border-radius: 999px;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }
        
        .glass-btn:hover {
            background: var(--glass-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            border-color: var(--theme-accent-dim);
        }
        
        .glass-btn:active {
            transform: scale(0.96);
        }

        .blog-header-btn {
            padding: 14px 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .strategix-badge-btn {
            padding: 12px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .brand-top-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--theme-accent);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--theme-accent);
            animation: pulse-accent 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }

        @keyframes pulse-accent {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
        }

        .badge-text h4 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-style: italic;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.5px;
            color: var(--theme-accent);
        }

        .badge-text p {
            font-size: 0.7rem; 
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* BIO BANNER & VISUALS */
        .bio-banner {
            width: 100%;
            padding: 40px;
            display: flex;
            flex-direction: row-reverse; 
            align-items: center;
            gap: 40px;
        }

        .bio-visuals {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            flex-shrink: 0; 
        }

        .profile-pic {
            width: 160px;
            height: 160px;
            border-radius: 50%; 
            object-fit: cover;
            border: 1px solid var(--theme-accent-dim);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .badges-group {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .small-badge {
            width: 42px; 
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .small-badge:hover {
            transform: translateY(-3px) scale(1.1);
            filter: drop-shadow(0 6px 12px rgba(201, 169, 117, 0.2));
        }

        .bio-text {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        .bio-text p {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 300; 
            font-size: 0.95rem;
            line-height: 1.8;
            color: rgba(245, 245, 245, 0.85);
            letter-spacing: 0.4px;
            text-align: justify;
            text-justify: inter-word;
        }
        
        .bio-text p strong.name-highlight {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 1.15rem;
            color: var(--theme-accent);
            letter-spacing: 0px;
        }

        /* GRID SYSTEM */
        .base-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            width: 100%;
        }

        .app-card {
            border-radius: 28px; 
            padding: 24px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 16px;
            text-decoration: none;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .app-card:hover {
            background: var(--glass-hover);
            transform: translateY(-4px);
            border-color: rgba(201, 169, 117, 0.3);
        }
        
        .app-card:active {
            transform: scale(0.94);
        }

        .icon-wrapper {
            width: 54px; 
            height: 54px;
            border-radius: 22.5%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 1.6rem;
            color: rgba(255, 255, 255, 0.9);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.05), 0 4px 12px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .app-card:hover .icon-wrapper {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
            color: var(--theme-accent);
            border-color: rgba(201, 169, 117, 0.4);
        }

        .card-info h3 { 
            font-size: 0.9rem; 
            font-weight: 700; 
            letter-spacing: -0.2px;
        }
        
        .card-info p { 
            font-size: 0.7rem; 
            color: var(--text-muted); 
            margin-top: 4px; 
            font-weight: 600; 
        }

        /* FOOTER */
        footer {
            margin-top: 40px;
            width: 100%;
            max-width: 1300px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 24px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        footer .footer-left span { color: var(--theme-accent); font-weight: 800; }
        
        footer .footer-right a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s ease;
            text-transform: none;
            letter-spacing: 0.5px;
        }
        footer .footer-right a:hover { color: var(--theme-accent); }

        /* MODALS */
        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000; 
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .modal.show { opacity: 1; }

        .modal-content {
            max-width: 540px; 
            margin: 10vh auto;
            border-radius: 32px;
